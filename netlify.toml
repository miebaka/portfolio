[build]
  command = "npm run build"
  publish = "dist"

# ── Security headers ──────────────────────────────────────────────────────
# Applied to every response. The site is fully static and loads no third-party
# scripts, so script-src can stay strict.
#
# The one executable inline script is the theme bootstrap in each page's
# <head>. It is covered by a hash,
# so 'unsafe-inline' is not needed.
#
#   IMPORTANT: editing that inline bootstrap changes its hash. Recompute with
#   the snippet in README ("Content Security Policy") and update the value
#   below, or every page will silently lose its theme bootstrap.
#
# JSON-LD blocks are type="application/ld+json" — data, not executed, and not
# governed by script-src, so they need no hash.
#
# style-src keeps 'unsafe-inline': the menu sets per-character animation
# timings (--char-d, --row-i) as inline style attributes at render time.
# Style injection needs an existing HTML-injection vector to exploit, and all
# 15 innerHTML sinks are escaped through utilities/dom.js, so this is a
# deliberate, contained trade rather than an oversight.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-DejhjEnE0qGjWCdM5ZUAHUSCZgjdWHcny5Yg+mSbXq8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ws.audioscrobbler.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    # Candidate policy removes the retired Last.fm API connection. It has no
    # report-uri because no approved receiver exists; browser console reports
    # are the staging signal before the enforced policy is changed.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-DejhjEnE0qGjWCdM5ZUAHUSCZgjdWHcny5Yg+mSbXq8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No feature on this site needs camera, mic, geolocation or payments.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# Netlify is a static-output fallback only. The Vercel /api/contact function is
# not deployed here, so contact submission is not a supported Netlify feature.
# Keep API-shaped responses uncacheable if a function is added in the future.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML, CSS, JS — always revalidate; no stale copies at the edge
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Stable asset names may be replaced between releases, so browsers revalidate
# instead of holding an obsolete "immutable" copy for a full year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
