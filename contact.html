  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://miebaka.design/" },
      { "@type": "ListItem", "position": 2, "name": "Contact", "item": "https://miebaka.design/contact.html" }

  <script>document.documentElement.classList.replace("no-js","has-js");if(localStorage.getItem("color-theme")==="dark")document.documentElement.dataset.theme="dark";</script>

  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-mount="nav"></header>

  <main id="main">

    <!-- Hero -->
    <section class="hero container">
      <p class="meta hero__role reveal">Contact</p>
      <h1 class="hero__title measure-hero reveal">Got a brief, or the beginning of one?</h1>
    </section>

    <!-- Contact info + form -->
    <section class="section--tight" id="contact">
      <div class="container contact-page reveal">

        <div class="contact-info">
          <dl>
            <dt>Email</dt>
            <dd><a class="link" data-href="email" href="mailto:miebakakiki@gmail.com">hello@miebaka.design</a></dd>
            <dt>Location</dt>
            <dd>Lagos, Nigeria &mdash; WAT (UTC+1)</dd>
            <dt>Availability</dt>
            <dd>Open to remote roles worldwide</dd>
          </dl>
        </div>

        <form class="contact__form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required aria-required="true" aria-describedby="form-status">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" aria-describedby="form-status">
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" autocomplete="off" placeholder="What are you building?"></textarea>
          </div>
          <div class="contact__submit">
            <button class="btn btn--primary" type="submit">Send message &rarr;</button>
          </div>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

      </div>
    </section>

  </main>

  <footer data-mount="footer"></footer>

  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
