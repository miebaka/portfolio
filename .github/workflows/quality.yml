name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new main commit supersedes its older visual/quality run. Do not waste
# browser runners testing code that is no longer the branch head.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Use GitHub's broadly available hosted Linux runner. The suite has no
    # committed pixel snapshots and already installs its Chromium dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Verify Node.js runtime
        run: node --version && node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - run: npm ci
      - name: Lint authored HTML
        run: npm run lint:html
      - name: Enforce Geist Unified typography (Stylelint + contract)
        run: npm run lint:typography && npm run test:typography
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      # Keep visual evidence even on green builds; passing functional tests
      # alone cannot establish convincing physical materials or tab alignment.
      - name: Upload Work folder visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: work-folder-visual-review
          path: test-results/folder-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile SEO and performance baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-mobile-lighthouse
          path: .lighthouseci/mobile-reports
          if-no-files-found: ignore
          retention-days: 30
      # audit:shipped blocks releases; audit:dev-tools reports pinned LHCI/tooling
      # advisories without misrepresenting them as production dependencies.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quality-failure-evidence
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
