name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    # Use GitHub's broadly available hosted Linux runner. The suite has no
    # committed pixel snapshots and already installs its Chromium dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Verify Node.js runtime
        run: node --version && node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      # audit:shipped blocks releases; audit:dev-tools reports pinned LHCI/tooling
      # advisories without misrepresenting them as production dependencies.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quality-failure-evidence
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
