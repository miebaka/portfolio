name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history without exposing matched credentials
        run: |
          report="$(mktemp -d)"
          chmod 777 "$report"
          trap 'rm -rf "$report"' EXIT
          result=0
          docker run --rm --network none --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" -v "$report:/report" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git --redact=100 --no-banner --log-opts="--all" --report-format=json --report-path=/report/findings.json /repo || result=$?
          if test -f "$report/findings.json"; then
            jq -c '[.[] | {RuleID, File, StartLine, Commit, Fingerprint}]' "$report/findings.json"
          fi
          exit "$result"
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: node --test tests/security.test.mjs tests/contact-api.test.mjs tests/contact-form.test.mjs tests/contact-fallback.test.mjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=low
